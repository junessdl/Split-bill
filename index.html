<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หารบิล 💸</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>

:root{
  --primary:#6C63FF;
  --primary-light:#EEEDff;
  --accent:#FF6584;
  --green:#43C59E;
  --green-light:#E1F5EE;
  --red:#FF6584;
  --red-light:#FFEEF2;
  --bg:#F7F6FF;
  --card:#FFFFFF;
  --text:#2D2B55;
  --muted:#9896B8;
  --border:#E8E7F5;
  --radius:16px;
  --shadow:0 4px 24px rgba(108,99,255,0.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Prompt',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:40px;
}

.header{
  background:var(--primary);
  color:white;
  padding:24px 20px 32px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.header::before{
  content:'';
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  top:-60px;
  right:-40px;
}

.header::after{
  content:'';
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(255,255,255,0.06);
  bottom:-30px;
  left:-20px;
}

.header h1{
  font-size:26px;
  font-weight:600;
}

.header p{
  font-size:14px;
  opacity:0.75;
  margin-top:4px;
}

.room-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.18);
  border-radius:99px;
  padding:4px 14px;
  font-size:13px;
  margin-top:10px;
  cursor:pointer;
}

.container{
  max-width:480px;
  margin:0 auto;
  padding:0 16px;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  margin-top:16px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.card-title{
  font-size:15px;
  font-weight:600;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
}

input{
  width:100%;
  padding:11px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-family:'Prompt',sans-serif;
  font-size:14px;
  color:var(--text);
  background:var(--bg);
  margin-bottom:10px;
  outline:none;
}

.btn{
  display:block;
  width:100%;
  padding:13px;
  background:var(--primary);
  color:white;
  border:none;
  border-radius:10px;
  font-family:'Prompt',sans-serif;
  font-size:15px;
  font-weight:500;
  cursor:pointer;
}

.btn.secondary{
  background:var(--primary-light);
  color:var(--primary);
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.friends-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.friend-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:99px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  border:1.5px solid var(--border);
  background:#f8f8ff;
  transition:0.2s;
}

.active-chip{
  background:#6C63FF !important;
  color:white !important;
  border-color:#6C63FF !important;
}

.item-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.summary-row{
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  background:#f8f8ff;
}

.tip-wrap{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tip-btn{
  padding:7px 14px;
  border-radius:99px;
  border:1.5px solid var(--border);
  background:var(--bg);
  cursor:pointer;
}

.tip-btn.active{
  background:var(--primary-light);
  border-color:var(--primary);
  color:var(--primary);
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#43C59E;
}

.section-hidden{
  display:none;
}

</style>
</head>

<body>

<!-- JOIN -->

<div id="joinSection">

  <div style="text-align:center;padding:40px 20px;">

    <div style="font-size:48px;margin-bottom:12px;">
      💸
    </div>

    <h2>หารบิลกับเพื่อน</h2>

    <p style="margin-top:8px;color:var(--muted);">
      สร้างห้องแล้วแชร์ให้เพื่อน
    </p>

    <div class="container">

      <input
        type="text"
        id="nameInput"
        placeholder="ชื่อของคุณ..."
      >

      <div class="row2">

        <button
          class="btn"
          onclick="createRoom()">

          ➕ สร้างห้อง
        </button>

        <button
          class="btn secondary"
          onclick="showJoinBox()">

          🔗 เข้าร่วม
        </button>

      </div>

      <div
        id="joinBox"
        class="section-hidden"
        style="margin-top:12px;">

        <input
          type="text"
          id="roomCodeInput"
          placeholder="รหัสห้อง..."
        >

        <button
          class="btn"
          onclick="joinRoom()">

          เข้าร่วมห้อง
        </button>

      </div>

    </div>

  </div>

</div>

<!-- MAIN -->

<div id="mainApp" class="section-hidden">

  <div class="header">

    <h1>💸 หารบิล</h1>

    <p id="tripName">กำลังโหลด...</p>

    <div
      class="room-badge"
      onclick="copyRoomLink()">

      <span class="online-dot"></span>

      <span id="roomCodeDisplay">
        ---
      </span>

    </div>

  </div>

  <div class="container">

    <!-- MEMBERS -->

    <div class="card">

      <div class="card-title">
        👥 สมาชิกในห้อง
      </div>

      <div
        id="membersList"
        class="friends-wrap">
      </div>

    </div>

    <!-- QR -->

    <div class="card">

      <div class="card-title">
        🏦 QR รับเงินของคุณ
      </div>

      <input
        type="file"
        id="qrUpload"
        accept="image/*"
      >

      <button
        class="btn"
        onclick="uploadQR()">

        อัปโหลด QR
      </button>

      <div id="myQRPreview"></div>

    </div>

    <!-- ADD ITEM -->

    <div class="card">

      <div class="card-title">
        🧾 เพิ่มรายการ
      </div>

      <input
        type="text"
        id="itemName"
        placeholder="ชื่อรายการ"
      >

      <input
        type="number"
        id="itemAmount"
        placeholder="จำนวนเงิน"
      >

      <div style="margin-bottom:10px;">

        <div style="font-size:13px;margin-bottom:6px;">
          จ่ายโดย
        </div>

        <div
          id="payerSelect"
          class="friends-wrap">
        </div>

      </div>

      <div style="margin-bottom:14px;">

        <div style="font-size:13px;margin-bottom:6px;">
          หารกับใคร
        </div>

        <div
          id="splitSelect"
          class="friends-wrap">
        </div>

      </div>

      <button
        class="btn"
        onclick="addItem()">

        + เพิ่มรายการ
      </button>

    </div>

    <!-- TIP -->

    <div class="card">

      <div class="card-title">
        🎉 ทิปเพิ่ม
      </div>

      <div class="tip-wrap">

        <button
          class="tip-btn active"
          onclick="setTip(0,this)">
          ไม่ทิป
        </button>

        <button
          class="tip-btn"
          onclick="setTip(5,this)">
          5%
        </button>

        <button
          class="tip-btn"
          onclick="setTip(10,this)">
          10%
        </button>

        <button
          class="tip-btn"
          onclick="setTip(15,this)">
          15%
        </button>

        <button
          class="tip-btn"
          onclick="setTip(20,this)">
          20%
        </button>

      </div>

    </div>

    <!-- ITEMS -->

    <div
      class="card"
      id="itemsCard"
      style="display:none;">

      <div class="card-title">
        📋 รายการทั้งหมด
      </div>

      <div id="itemsList"></div>

    </div>

    <!-- SUMMARY -->

    <div
      class="card"
      id="summaryCard"
      style="display:none;">

      <div class="card-title">
        💰 สรุป
      </div>

      <div id="summaryList"></div>

    </div>

  </div>

</div>

<!-- QR MODAL -->

<div
id="qrModal"
style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
z-index:9999;
align-items:center;
justify-content:center;
padding:20px;
">

  <div style="
    background:white;
    border-radius:20px;
    padding:20px;
    width:100%;
    max-width:360px;
    text-align:center;
  ">

    <h2>สแกนเพื่อจ่าย</h2>

    <img
      id="qrImage"
      style="
        width:220px;
        margin-top:12px;
        border-radius:14px;
      "
    >

    <div
      id="payAmount"
      style="
        font-size:24px;
        font-weight:600;
        margin-top:14px;
        color:#6C63FF;
      ">
    </div>

<input
  type="file"
  id="slipUpload"
  accept="image/*"
  style="margin-top:16px;"
>

<button
  class="btn"
  style="margin-top:12px;"
  onclick="submitSlip()">

  ✅ จ่ายแล้ว
</button>

    <button
      class="btn"
      style="margin-top:16px;"
      onclick="closeQRModal()">

      ปิด
    </button>

  </div>

</div>

<script>

const firebaseConfig = {
  databaseURL:"https://split-bill-a0006-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const db = firebase.database();
const storage = firebase.storage();

let roomId = null;
let myName = null;
let roomOwner = null;

let members = [];
let memberData = {};
let items = [];

let selectedPayer = null;
let selectedSplit = new Set();

let tipPct = 0;
let currentReceiver = null;
let currentAmount = 0;

window.onload = () => {

  const params = new URLSearchParams(window.location.search);

  const room = params.get('room');

  if(room){

    document.getElementById('roomCodeInput').value = room;

    document.getElementById('joinBox').style.display = 'block';
  }
};

function createRoom(){

  const name =
    document.getElementById('nameInput').value.trim();

  if(!name){
    alert('ใส่ชื่อก่อน');
    return;
  }

  myName = name;

  roomId = Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

  db.ref(`rooms/${roomId}`).set({
    owner:name
  });

  db.ref(`rooms/${roomId}/members/${name}`).set({
    name:name
  });

  startListening();
}

function showJoinBox(){

  document.getElementById('joinBox').style.display =
    'block';
}

function joinRoom(){

  const name =
    document.getElementById('nameInput').value.trim();

  const code =
    document.getElementById('roomCodeInput').value
    .trim()
    .toUpperCase();

  if(!name || !code){
    alert('กรอกข้อมูลก่อน');
    return;
  }

  myName = name;
  roomId = code;

  db.ref(`rooms/${roomId}`).once('value',snap=>{

    if(!snap.exists()){
      alert('ไม่เจอห้อง');
      return;
    }

    db.ref(`rooms/${roomId}/members/${name}`).set({
      name:name
    });

    startListening();

  });

}

function startListening(){

  document.getElementById('joinSection').style.display =
    'none';

  document.getElementById('mainApp').style.display =
    'block';

  document.getElementById('roomCodeDisplay').innerText =
    roomId;

  document.getElementById('tripName').innerText =
    'ห้อง : ' + roomId;

  db.ref(`rooms/${roomId}/owner`).on('value',snap=>{

    roomOwner = snap.val();

  });

  db.ref(`rooms/${roomId}/members`).on('value',snap=>{

    members = [];
    memberData = {};

    snap.forEach(child=>{

      const data = child.val();

      members.push(data.name);

      memberData[data.name] = data;

    });

    renderMembers();
    renderPayerSelect();
    renderSplitSelect();
    renderSummary();

  });

  db.ref(`rooms/${roomId}/items`).on('value',snap=>{

    items = [];

    snap.forEach(child=>{

      items.push({
        id:child.key,
        ...child.val()
      });

    });

    renderItems();
    renderSummary();

  });

}

function renderMembers(){

  const el =
    document.getElementById('membersList');

  el.innerHTML = members.map(m=>`

    <div class="friend-chip">

      ${m}

      ${m === roomOwner ? ' 👑' : ''}

    </div>

  `).join('');
}

function renderPayerSelect(){

  const el =
    document.getElementById('payerSelect');

  el.innerHTML = members.map(m=>`

    <div
      class="friend-chip
      ${selectedPayer === m ? 'active-chip' : ''}"

      onclick="selectPayer('${m}')">

      ${m}

    </div>

  `).join('');
}

function selectPayer(name){

  selectedPayer = name;

  renderPayerSelect();
}

function renderSplitSelect(){

  const el =
    document.getElementById('splitSelect');

  el.innerHTML = members.map(m=>`

    <div
      class="friend-chip
      ${selectedSplit.has(m) ? 'active-chip' : ''}"

      onclick="toggleSplit('${m}')">

      ${m}

    </div>

  `).join('');
}

function toggleSplit(name){

  if(selectedSplit.has(name)){

    selectedSplit.delete(name);

  }else{

    selectedSplit.add(name);
  }

  renderSplitSelect();
}

function addItem(){

  const name =
    document.getElementById('itemName').value.trim();

  const amount =
    parseFloat(
      document.getElementById('itemAmount').value
    );

  if(!name || !amount){
    alert('กรอกข้อมูล');
    return;
  }

  if(!selectedPayer){
    alert('เลือกคนจ่าย');
    return;
  }

  if(selectedSplit.size === 0){
    alert('เลือกคนหาร');
    return;
  }

  db.ref(`rooms/${roomId}/items`).push({

    name:name,
    amount:amount,
    payer:selectedPayer,
    split:[...selectedSplit]

  });

  document.getElementById('itemName').value = '';
  document.getElementById('itemAmount').value = '';

  selectedPayer = null;
  selectedSplit.clear();

  renderPayerSelect();
  renderSplitSelect();

}

function renderItems(){

  const card =
    document.getElementById('itemsCard');

  const list =
    document.getElementById('itemsList');

  if(!items.length){

    card.style.display = 'none';

    return;
  }

  card.style.display = 'block';

  list.innerHTML = items.map(it=>`

    <div class="item-row">

      <div>

        <div>${it.name}</div>

        <div style="font-size:12px;color:gray;">
          ${it.payer}
        </div>

      </div>

      <div>
        ฿${it.amount}
      </div>

    </div>

  `).join('');

}

function renderSummary(){

  const card =
    document.getElementById('summaryCard');

  const list =
    document.getElementById('summaryList');

  if(!items.length){

    card.style.display = 'none';

    return;
  }

  card.style.display = 'block';

  const owes = {};

  members.forEach(m=>owes[m]=0);

  items.forEach(it=>{

    const total =
      it.amount + (it.amount * tipPct / 100);

    const share =
      total / it.split.length;

    it.split.forEach(m=>{

      owes[m] += share;

    });

    owes[it.payer] -= total;

  });

  list.innerHTML = members.map(m=>{

    const val = owes[m];

    const owing = val > 0;

    const absVal = Math.abs(Math.round(val));

    return `

      <div class="summary-row">

        <div style="font-weight:600;">
          ${m}
        </div>

        <div style="margin-top:6px;">

          ${
            owing
            ? `
              ต้องจ่าย ฿${absVal}

              <button
                class="btn secondary"
                style="margin-top:10px;"
                onclick="
                  showQR(
                    '${findReceiver()}',
                    ${absVal}
                  )
                ">

                จ่ายเลย

              </button>
            `
            : `
              ได้คืน ฿${absVal}
            `
          }

        </div>

      </div>

    `;

  }).join('');

}

function findReceiver(){

  const owes = {};

  members.forEach(m=>owes[m]=0);

  items.forEach(it=>{

    const total =
      it.amount + (it.amount * tipPct / 100);

    const share =
      total / it.split.length;

    it.split.forEach(m=>{

      owes[m] += share;

    });

    owes[it.payer] -= total;

  });

  let receiver = null;
  let lowest = 0;

  Object.keys(owes).forEach(name=>{

    if(owes[name] < lowest){

      lowest = owes[name];

      receiver = name;
    }

  });

  return receiver;
}

function uploadQR(){

  const file =
    document.getElementById('qrUpload').files[0];

  if(!file){
    alert('เลือก QR');
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const base64 = e.target.result;

    db.ref(`rooms/${roomId}/members/${myName}`)
      .update({
        qrImage:base64
      });

    document.getElementById('myQRPreview').innerHTML = `

      <img
        src="${base64}"
        style="
          width:140px;
          margin-top:12px;
          border-radius:12px;
        "
      >

    `;

  };

  reader.readAsDataURL(file);

}

function showQR(receiverName,amount){

  const receiver =
    memberData[receiverName];

  if(!receiver?.qrImage){

    alert('คนรับยังไม่ได้อัปโหลด QR');

    return;
  }

  currentReceiver = receiverName;
  currentAmount = amount;

  document.getElementById('qrModal').style.display =
    'flex';

  document.getElementById('qrImage').src =
    receiver.qrImage;

  document.getElementById('payAmount').innerText =
    amount.toLocaleString() + ' kip';
}

async function submitSlip(){

  const file =
    document.getElementById('slipUpload').files[0];

  if(!file){

    alert('อัปโหลดสลิปก่อน');

    return;
  }

  const fileName =
    Date.now() + '_' + file.name;

  const storageRef =
    storage.ref(
      `slips/${roomId}/${fileName}`
    );

  await storageRef.put(file);

  const url =
    await storageRef.getDownloadURL();

  await db.ref(`rooms/${roomId}/payments`).push({

    from: myName,
    to: currentReceiver,
    amount: currentAmount,
    slipUrl: url,
    status: 'pending',
    createdAt: Date.now()

  });

  alert('แจ้งการจ่ายแล้ว ✅');

  closeQRModal();
}

function closeQRModal(){

  document.getElementById('qrModal').style.display =
    'none';
}

function setTip(pct,btn){

  tipPct = pct;

  document.querySelectorAll('.tip-btn')
    .forEach(b=>b.classList.remove('active'));

  btn.classList.add('active');

  renderSummary();
}

function copyRoomLink(){

  const url =
    `${window.location.origin}${window.location.pathname}?room=${roomId}`;

  navigator.clipboard.writeText(url);

  alert('คัดลอกลิงก์แล้ว');

}

</script>
</body>
</html>
